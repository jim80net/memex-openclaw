name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Enforce package manager and lockfile policy
        run: pnpm verify:lock-policy

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Run adapter gates
        run: pnpm check

      - name: Cache local embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/memex-openclaw-models
          key: memex-openclaw-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Verify packed runtime security
        run: pnpm verify:core-security

  release-please:
    needs: release-gate
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        if: steps.release.outputs.prs_created == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.release.outputs.prs_created == 'true'
        with:
          node-version: 22

      - name: Approve held CI for the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: node scripts/approve-release-pr-run.mjs
